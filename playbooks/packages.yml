---
- name: Install Linux packages
  hosts: linux
  become: true

  tasks:
    - name: Ensure baseline packages are installed
      ansible.builtin.apt:
        name:
          - git
          - curl
          - nano
          - htop
          - tree
          - unzip
          - openssh-server
        state: present
        update_cache: true
        cache_valid_time: 3600  # 1 hour

- name: Install web server packages
  hosts: web_servers
  become: true

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present

- name: Install monitoring server packages
  hosts: monitoring_servers
  become: true

  tasks:
    - name: Install Zabbix repository configuration
      ansible.builtin.apt:
        deb: https://repo.zabbix.com/zabbix/8.0/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_8.0+ubuntu26.04_all.deb
        state: present

    - name: Install Zabbix packages
      ansible.builtin.apt:
        name:
          - zabbix-server-pgsql
          - zabbix-frontend-php
          - php8.5-pgsql
          - zabbix-nginx-conf
          - zabbix-sql-scripts
          - zabbix-agent
          - postgresql
        state: present
        update_cache: true
