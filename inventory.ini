[linux]
linux01 ansible_host=192.168.2.11 ansible_user=localadmin ansible_become_password="{{ vault_linux01_become_password }}"

[web_servers]
linux01

[halcyon_intranet]
linux01

# Ubuntu 26.04 hosts have a compatibility issue that requires using sudo.ws
[sudo_rs_hosts]
linux01

[sudo_rs_hosts:vars]
ansible_become_exe=/usr/bin/sudo.ws

[windows]
dc01 ansible_host=192.168.2.10 ansible_user=Administrator ansible_password="{{ vault_dc01_administrator_password }}"

[domain_controllers]
dc01

[windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
ansible_winrm_scheme=http
